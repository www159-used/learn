name: Deploy mdBook

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install mdBook
        run: |
          MDBOOK_VERSION=0.5.2
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo for preprocessors
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-mdbook-pre-v2-${{ hashFiles('book.toml') }}

      - name: Install preprocessors
        run: |
          cargo install mdbook-modern-fomular --force
          cargo install --git https://github.com/www159-used/mdbook-drawio --force
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: mdbook build

      - name: Add CNAME for custom domain
        run: echo 'gh.www159.top' > book/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
