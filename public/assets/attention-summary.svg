  <ellipse cx="410" cy="1070" rx="75" ry="35" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <ellipse cx="410" cy="1070" rx="67" ry="27" fill="none" stroke="#b85450" stroke-width="1.5"/>
  <text class="state-body" x="410" y="1066" text-anchor="middle" font-weight="700">&lt;EOF&gt;</text>
  <text class="state-body" x="410" y="1085" text-anchor="middle">&#x505C;&#x673A;</text>

  <path class="edge" d="M 410 53 L 410 70"/>
  <path class="edge" d="M 410 140 L 410 180"/>
  <path class="edge" d="M 410 270 L 410 320"/>
  <path class="edge" d="M 410 450 L 410 520"/>
  <path class="edge" d="M 410 650 L 410 720"/>
  <path class="edge" d="M 410 820 L 410 860"/>
