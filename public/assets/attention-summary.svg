  <text class="state-body" x="410" y="124" text-anchor="middle">&#x6211;&#x7684;&#x540D;&#x5B57;&#x662F;</text>

  <rect class="state" x="260" y="180" width="300" height="90" rx="10" fill="#d5e8d4" stroke="#82b366"/>
