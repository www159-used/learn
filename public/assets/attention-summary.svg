    <tspan x="410" dy="24">Attention + MLP</tspan>
    <tspan x="410" dy="24">&#x5EFA;&#x7ACB; KV Cache</tspan>
  </text>

  <rect class="state" x="260" y="520" width="300" height="130" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
