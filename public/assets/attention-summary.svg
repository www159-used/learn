      <path d="M 0 0 L 8 4 L 0 8 z" fill="#000000"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #000000;
      }
      .state { stroke-width: 1.5; }
      .state-title { font-size: 15px; font-weight: 700; }
      .state-body { font-size: 14px; }
      .edge { fill: none; stroke: #000000; stroke-width: 1.5; marker-end: url(#arrow); }
      .edge-label { font-size: 12px; text-anchor: middle; }
